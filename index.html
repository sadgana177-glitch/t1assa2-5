const takeWrong = (correct, list) => { const out = []; for (const w of list) if (w !== correct && !out.includes(w)) out.push(w); return out.slice(0, 3); };

/* ---------- problem generators (numbers differ from the worksheet) ---------- */
const PAIRS = [['أ','ب'], ['جـ','د'], ['هـ','و']];

function genGroup(m, P) {
  const L = P.L || pick(PAIRS), A = L[0], B = L[1];
  let k1 = P.k1, k2 = P.k2;
  if (!k1) { k1 = rnd(2, 9); do { k2 = rnd(2, 9); } while (m === 1 ? Math.abs(k2 - k1) < 2 : k2 === k1); }

function gen2(P = {}) {
  const k = P.k || rnd(2, 8), q = P.q || pick([2, 5, 6, 7]), r = P.r || rnd(2, 9);

    steps: [
      { note: 'نجمّع الحدّين الأولين معاً. بين المجموعتين إشارة سالبة، فنأخذ (-) عاملاً مشتركاً من الحدّين الأخيرين فتتغير إشارتاهما.', html: `(${ga(t1)}) - (${gb(t2)})` },
      { note: 'نأخذ عاملاً مشتركاً من كل مجموعة، فيظهر القوس نفسه.', html: `${cf(co(k) + 'س')}${cb(br)} - ${cf(ar(r) + 'ص')}${cb(br)}` },

function gen3(P = {}) {
  const neg = P.neg !== undefined ? P.neg : Math.random() < .5;

function gen5(P = {}) {
  const pq = P.p ? [P.p, P.q] : pick([[3, 4], [2, 5], [5, 7], [3, 7], [4, 7], [5, 6]]);
  const p = pq[0], q = pq[1], v = P.v || pick([['س','ص'], ['أ','ب'], ['م','ن'], ['جـ','د'], ['هـ','و']]);
  let g1 = P.g1, g2 = P.g2;
  if (!g1) { g1 = rnd(2, 9); do { g2 = rnd(2, 9); } while (g2 === g1); }
  const a = v[0], b = v[1], inner = `${ar(p)}${a} + ${ar(q)}${b}`, sum = g1 + g2;
  const t1 = `${ar(g1 * p)}${a} + ${ar(g1 * q)}${b}`, t2 = `${ar(g2 * p)}${a} + ${ar(g2 * q)}${b}`;
  const answer = `(${inner})(${ar(sum)})`;
  return {
    expr: `${t1} + ${t2}`, answer,
    wrong: takeWrong(answer, [`(${inner})(${ar(g1 * g2)})`, `(${ar(q)}${a} + ${ar(p)}${b})(${ar(sum)})`, `(${ar(p)}${a} - ${ar(q)}${b})(${ar(sum)})`, `(${inner})(${ar(g1)})`]),
    steps: [
      { note: 'نجمّع الحدّين الأول والثاني، والثالث والرابع.', html: `(${ga(t1)}) + (${gb(t2)})` },
      { note: `المعاملات كبيرة، فنبحث عن أكبر عدد يقسم المعاملين في كل مجموعة: ${ar(g1)} في الأولى و${ar(g2)} في الثانية.`, html: `${cf(ar(g1))}(${cb(inner)}) + ${cf(ar(g2))}(${cb(inner)})` },
      { note: 'القوس المشترك يتكرر، فنأخذه عاملاً مشتركاً.', html: `(${cb(inner)})(${cf(ar(g1))} + ${cf(ar(g2))})` },
      { note: `نجمع العددين داخل القوس الثاني: ${ar(g1)} + ${ar(g2)} = ${ar(sum)}.`, html: `(${inner})(${ar(sum)})` }
    ]
  };
}

function gen6(P = {}) {
  let p = P.p, q = P.q;
  if (!p) { do { p = pick([5, 6, 7]); q = pick([2, 4, 5]); } while (p === q); }
  const k = P.k || rnd(2, 6), Q = q * q, br = `(س - ${ar(p)})`, sq = `(س - ${ar(q)})(س + ${ar(q)})`;
  const answer = `${ar(k)}${br}${sq}`;
  return {
    expr: `${ar(k)}س³ - ${ar(k * p)}س² - ${ar(k * Q)}س + ${ar(k * p * Q)}`, answer,
    wrong: takeWrong(answer, [`${br}${sq}`, `${ar(k)}${br}(س² - ${ar(Q)})`, `${ar(k)}(س + ${ar(p)})${sq}`, `${ar(k)}${br}(س - ${ar(q)})(س - ${ar(q)})`]),
    steps: [
      { note: 'نجمّع الحدّين الأولين، ونأخذ (-) عاملاً مشتركاً من الحدّين الأخيرين.', html: `(${ga(`${ar(k)}س³ - ${ar(k * p)}س²`)}) - (${gb(`${ar(k * Q)}س - ${ar(k * p * Q)}`)})` },
      { note: 'نأخذ عاملاً مشتركاً من كل مجموعة، فيظهر القوس نفسه.', html: `${cf(ar(k) + 'س²')}${cb(br)} - ${cf(ar(k * Q))}${cb(br)}` },
      { note: 'نأخذ القوس المشترك عاملاً مشتركاً.', html: `${cb(br)}(${ar(k)}س² - ${ar(k * Q)})` },
      { note: `نأخذ العامل المشترك ${ar(k)} من القوس الثاني، فيظهر فرق بين مربعين.`, html: `${cf(ar(k))}${cb(br)}(س² - ${ar(Q)})` },
      { note: `نحلّل الفرق بين المربعين: س² - ${ar(Q)} = (س - ${ar(q)})(س + ${ar(q)}).`, html: `${ar(k)}${br}${sq}` }
    ]
  };
}

  { name: 'التجميع مع تغيير الإشارة (أخذ سالب)', short: 'تغيير الإشارة', idea: 'عند وجود إشارة سالبة بين المجموعتين، نأخذ (-) عاملاً مشتركاً لتظهر نفس القوس.', gen: gen2, first: { k: 2, q: 5, r: 3 } },
  { name: 'التجميع ثم فرق بين مربعين (تحليل تام)', short: 'فرق بين مربعين', idea: 'بعد التجميع، يظهر قوس (س² - عدد) وهو فرق بين مربعين، فيجب إكمال التحليل.', gen: gen3, first: { neg: true, p: 7, q: 2 } },

  { name: 'التجميع مع معاملات أكبر وأرقام أولية', short: 'معاملات أكبر', idea: 'معاملات الحدود ليست صغيرة، وقد تكون أعداداً أولية، فيحتاج الطالب للتفكير في العامل المشترك المناسب.', gen: gen5, first: { p: 3, q: 4, g1: 2, g2: 5, v: ['م','ن'] } },

function optionsHtml(p, st, act, extra) {

    const sel = extra && extra.sel === i;
    return `<button class="opt ${cls}" ${dis} data-act="${act}" data-o="${i}" aria-pressed="${!!sel}"><span class="dot"></span>${M(o)}</button>`;
  }).join('')}</div>`;
}

function stepsHtml(p, n) {

function buildQuiz() {
  const qs = [];
  LESSONS.forEach((l, i) => {
    const a = l.gen(); let b = l.gen(), guard = 0;
    while (b.expr === a.expr && guard++ < 20) b = l.gen();
    qs.push(Object.assign(withOpts(a), { sec: i }), Object.assign(withOpts(b), { sec: i }));
  });
  return qs;
}

function quiz() {
  const Q = state.quiz;
  if (Q.phase === 'intro') {
    return `<div class="quiz">${contact('eg')}

    </section></div>`;
  }
  if (Q.phase === 'confirm') {
    return `<section class="card" style="display:flex;flex-direction:column;gap:14px;max-width:560px">
      <h2>تأكيد الاسم</h2>
      <p>هل اسمك: <b style="font-size:1.3rem">${esc(Q.name.trim())}</b> ؟</p>
      <p class="hint">سيظهر هذا الاسم في نتيجة الاختبار، ولا يمكن تغييره بعد البدء.</p>
      <div class="row"><button class="btn" data-act="begin">نعم، ابدأ الاختبار</button><button class="btn ghost" data-act="editName">تعديل الاسم</button></div>
    </section>`;
  }
  if (Q.phase === 'run') {
    const q = Q.qs[Q.i], sel = Q.answers[Q.i], last = Q.i === Q.qs.length - 1;
    return `<section class="card quiz">
      <div><div class="qhead"><span>السؤال ${ar(Q.i + 1)} من ${ar(Q.qs.length)}</span><span>${esc(Q.name.trim())}</span></div><div class="bar"><i style="width:${(Q.i / Q.qs.length) * 100}%"></i></div></div>
      <div class="board"><p class="lbl">حلّل كثيرة الحدود التالية تحليلاً تاماً:</p><div class="expr">${M(q.expr)}</div></div>
      ${optionsHtml(q, null, 'qpick', { sel })}
      <div class="row"><button class="btn" id="btnQ" data-act="qnext" ${sel === undefined ? 'disabled' : ''}>${last ? 'إنهاء الاختبار' : 'السؤال التالي'}</button></div>
    </section>`;
  }
  const total = Q.qs.length;
  const per = LESSONS.map(() => 0); let score = 0;
  Q.qs.forEach((q, i) => { if (q.opts[Q.answers[i]] === q.answer) { score++; per[q.sec]++; } });
  const msg = score >= 11 ? 'ممتاز، أتقنت الدرس.' : score >= 9 ? 'جيد جداً، راجع الأخطاء القليلة.' : score >= 6 ? 'جيد، راجع الأقسام المعلّمة ثم أعد المحاولة.' : 'راجع الشرح التفاعلي ثم أعد الاختبار.';
  const brk = per.map((s, i) => `<div class="${s === 2 ? 'full' : ''}"><span>القسم ${ar(i + 1)}: ${LESSONS[i].short}</span><span><b>${ar(s)}</b> من ${ar(2)}${s < 2 ? ` <button class="btn ghost" style="padding:2px 10px;font-size:.85rem" data-act="review" data-i="${i}">راجع</button>` : ''}</span></div>`).join('');
  const rev = Q.qs.map((q, i) => {
    const ok = q.opts[Q.answers[i]] === q.answer;
    return `<details class="rev ${ok ? 'ok' : 'bad'}"><summary><span class="mark">${ok ? '✓' : '✗'}</span>${M(q.expr)}</summary><div class="body">
      <p>إجابتك: ${M(q.opts[Q.answers[i]])}</p>${ok ? '' : `<p>الإجابة الصحيحة: ${M(q.answer)}</p>`}${stepsHtml(q, q.steps.length)}</div></details>`;
  }).join('');
  return `<div class="quiz">
    <section class="card" style="display:flex;flex-direction:column;gap:12px">
      <p class="hint">نتيجة الطالب</p><h2>${esc(Q.name.trim())}</h2>

      <p><b>${msg}</b></p>
      <div class="brk">${brk}</div>
      <div class="row"><button class="btn" data-act="copyRes">نسخ النتيجة</button><button class="btn ghost" data-act="again">اختبار جديد بأرقام أخرى</button></div>
      ${Q.copy === 'ok' ? '<p class="msg ok" role="status">تم نسخ النتيجة.</p>' : ''}
      ${Q.copy === 'fail' ? `<p class="msg bad" role="status">تعذر النسخ تلقائياً، انسخ النص التالي:</p><textarea class="copybox" id="copybox" readonly>${esc(resultText(score, total))}</textarea>` : ''}
    </section>
    <h3>مراجعة الإجابات</h3>${rev}
    ${contact('eg')}
  </div>`;
}

function buildDoc(newHash) {

  js = js.replace(/const CFG = \{[^\n]*\};/, () => 'const CFG = {"ph":"' + newHash + '"};');
  if (!reset || js.indexOf(newHash) < 0) throw new Error('build');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
    '<title>' + document.title + '</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="stylesheet" href="' + TITLE_FONT + '"><style id="app-css">' + css + '</style><div id="root"></div><script id="app-js">' + js + '<\/script></body></html>';
}
async function saveTeacher() {
  const cur = $('#tCur').value, n1 = $('#tNew').value, n2 = $('#tNew2').value, btn = $('#btnSave');
  if (!cur || !n1 || !n2) return say('tmsg', 'أكمل جميع الحقول.');
  if (await sha(cur) !== CFG.ph) return say('tmsg', 'كلمة السر الحالية غير صحيحة.');
  if (normPw(n1).length < 4) return say('tmsg', 'كلمة السر الجديدة يجب ألا تقل عن ٤ أحرف.');
  if (normPw(n1) !== normPw(n2)) return say('tmsg', 'تأكيد كلمة السر غير مطابق.');
  const nh = await sha(n1);
  if (nh === CFG.ph) return say('tmsg', 'كلمة السر الجديدة مطابقة للحالية.');
  let art = null;
  try { art = window.claude && await window.claude.use('artifact'); } catch (e) {}
  if (!art) return say('tmsg', 'حفظ كلمة السر غير متاح في هذا العرض. افتح الصفحة من حساب المعلم.');
  let doc; try { doc = buildDoc(nh); } catch (e) { return say('tmsg', 'تعذر تجهيز الصفحة للحفظ.'); }
  const prev = lsGet(KEY); lsSet(KEY, nh); btn.disabled = true; say('tmsg', 'جارٍ الحفظ...', 'ok');
  try { await art.publish(doc); say('tmsg', 'تم الحفظ. ستتحدّث الصفحة بكلمة السر الجديدة.', 'ok'); }
  catch (err) {
    if (prev === null) { try { localStorage.removeItem(KEY); } catch (e) {} } else lsSet(KEY, prev);
    btn.disabled = false;
    const c = err && err.code;
    say('tmsg', c === 'conflict' ? 'تم تحديث الصفحة من مكان آخر. أعد المحاولة بعد تحديثها.' : (c === 'not_granted' || c === 'not_writer') ? 'تغيير كلمة السر متاح للمعلم فقط عند فتح الصفحة من حسابه.' : 'تعذر الحفظ. حاول مرة أخرى.');
  }
}

/* ---------- events ---------- */
async function act(a, t, e) {
  const S = state.L[state.lesson];
  switch (a) {
    case 'unlock': {
      const v = ($('#pw') || {}).value || '';
      if (!v.trim()) return say('gmsg', 'اكتب كلمة السر.');
      if (await sha(v) === CFG.ph) { lsSet(KEY, CFG.ph); state.unlocked = true; render(); } else say('gmsg', 'كلمة السر غير صحيحة. اطلبها من معلمتك.');
      return;
    }
    case 'teacher': state.teacher = true; render(); state.focus = 'tCur'; setTimeout(() => { const el = $('#tCur'); if (el) el.focus(); }, 0); return;
    case 'closeTeacher': state.teacher = false; render(); return;
    case 'closeOverlay': if (e.target === t) { state.teacher = false; render(); } return;
    case 'saveTeacher': return saveTeacher();
    case 'go': state.view = t.dataset.v; render(); scrollUp(); return;
    case 'home': state.view = null; render(); scrollUp(); return;
    case 'lesson': state.lesson = +t.dataset.i; render(); return;
    case 'next': S.shown = Math.min(S.cur.steps.length, S.shown + 1); state.focus = 'btnNext'; render(); return;
    case 'all': S.shown = S.cur.steps.length; render(); return;
    case 'reset': S.shown = 0; render(); return;
    case 'newEx': S.cur = LESSONS[state.lesson].gen(); S.shown = 0; render(); return;
    case 'tryPick': { const o = S.tp.opts[+t.dataset.o]; if (o === S.tp.answer) S.done = true; else if (!S.wrongPicks.includes(o)) S.wrongPicks.push(o); render(); return; }
    case 'sol': S.showSol = !S.showSol; render(); return;
    case 'newTry': S.tp = withOpts(LESSONS[state.lesson].gen()); S.wrongPicks = []; S.done = false; S.showSol = false; render(); return;
    case 'toConfirm': if (state.quiz.name.trim().length >= 3) { state.quiz.phase = 'confirm'; render(); scrollUp(); } return;
    case 'editName': state.quiz.phase = 'intro'; render(); return;
    case 'begin': Object.assign(state.quiz, { phase: 'run', qs: buildQuiz(), i: 0, answers: [], copy: null }); render(); scrollUp(); return;
    case 'qpick': state.quiz.answers[state.quiz.i] = +t.dataset.o; state.focus = 'btnQ'; render(); return;
    case 'qnext': if (state.quiz.answers[state.quiz.i] === undefined) return; if (state.quiz.i < state.quiz.qs.length - 1) state.quiz.i++; else state.quiz.phase = 'done'; render(); scrollUp(); return;
    case 'again': Object.assign(state.quiz, { phase: 'intro', qs: [], i: 0, answers: [], copy: null }); render(); scrollUp(); return;
    case 'review': state.lesson = +t.dataset.i; state.view = 'explain'; render(); scrollUp(); return;
    case 'copyRes': {
      const Q = state.quiz; let score = 0; Q.qs.forEach((q, i) => { if (q.opts[Q.answers[i]] === q.answer) score++; });
      try { await navigator.clipboard.writeText(resultText(score, Q.qs.length)); Q.copy = 'ok'; } catch (err) { Q.copy = 'fail'; }
      render(); const bx = $('#copybox'); if (bx) { bx.focus(); bx.select(); } return;
    }
  }
}
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (t) act(t.dataset.act, t, e); });
document.addEventListener('input', e => {
  if (e.target.id === 'studentName') { state.quiz.name = e.target.value; const b = $('#btnStart'); if (b) b.disabled = state.quiz.name.trim().length < 3; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.teacher) { state.teacher = false; render(); return; }
  if (e.key !== 'Enter') return;
  const id = e.target.id;
  if (id === 'pw') act('unlock'); else if (id === 'tCur' || id === 'tNew' || id === 'tNew2') act('saveTeacher'); else if (id === 'studentName') act('toConfirm');
});
render();
</script>
